  <text class="l" x="20" y="162" style="animation-delay:1.50s" xml:space="preserve"><tspan>    notion       24 tools   17,140  </tspan><tspan fill="#d2a8ff">████████████████████</tspan></text>
  <text class="l" x="20" y="182" style="animation-delay:1.62s" xml:space="preserve"><tspan>    playwright   25 tools    3,921  </tspan><tspan fill="#d2a8ff">█████░░░░░░░░░░░░░░░</tspan></text>
  <text class="l" x="20" y="202" style="animation-delay:1.74s" xml:space="preserve"><tspan>    github       26 tools    3,546  </tspan><tspan fill="#d2a8ff">████░░░░░░░░░░░░░░░░</tspan></text>
  <text class="l" x="20" y="222" style="animation-delay:1.86s" xml:space="preserve"><tspan>    filesystem   14 tools    1,678  </tspan><tspan fill="#d2a8ff">██░░░░░░░░░░░░░░░░░░</tspan></text>
  <text class="l" x="20" y="242" style="animation-delay:1.98s" xml:space="preserve"><tspan>    memory        9 tools      947  </tspan><tspan fill="#d2a8ff">█░░░░░░░░░░░░░░░░░░░</tspan></text>
  <text class="l" x="20" y="262" style="animation-delay:2.10s" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">  98 tools · 27,232 tokens · 14% of a 200K window</tspan><tspan fill="#7d8590"> — sent with every request</tspan><tspan>   grade </tspan><tspan fill="#f85149" font-weight="700">D</tspan></text>
  <text class="l" x="20" y="282" style="animation-delay:2.22s" xml:space="preserve"><tspan fill="#3fb950">  with slimcp ≈ 652 tokens → saves 26,580 (−98%)</tspan></text>
