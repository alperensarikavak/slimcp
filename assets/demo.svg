  <text class="l" x="20" y="422" style="animation-delay:3.06s" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">Fix it:</tspan><tspan> </tspan><tspan fill="#39c5cf">npx slimcp init</tspan><tspan fill="#7d8590">  (dry run; nothing changes until --yes)</tspan></text>
  <text class="l" x="20" y="442" style="animation-delay:3.18s" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">Share:</tspan><tspan> My MCP servers eat 27,232 tokens (14% of the context window) before I</tspan></text>
