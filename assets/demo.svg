    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #e6edf3; }
    .l { opacity: 0; animation: in .35s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } }
  </style>
  <rect width="900" height="504" rx="10" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="503" rx="10" fill="none" stroke="#30363d"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="24" text-anchor="middle" style="fill:#7d8590;font-size:12px">slimcp — zsh</text>
  <text class="l" x="20" y="62" style="animation-delay:0.20s" xml:space="preserve"><tspan fill="#3fb950">❯ </tspan><tspan>npx slimcp audit</tspan></text>
  <text class="l" x="20" y="82" style="animation-delay:1.02s" xml:space="preserve"></text>
  <text class="l" x="20" y="102" style="animation-delay:1.14s" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">slimcp audit</tspan><tspan fill="#7d8590"> — what your MCP tool definitions cost on every request (o200k tokens, 200K window)</tspan></text>
  <text class="l" x="20" y="122" style="animation-delay:1.26s" xml:space="preserve"></text>
