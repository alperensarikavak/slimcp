<!doctype html>
<!-- Source of assets/social-preview.png (1280×640). Render with: node scripts/render-social.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: radial-gradient(1200px 600px at 85% -10%, #1f2a44 0%, #0d1117 55%);
    color: #e6edf3;
    font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
    padding: 64px 80px;
    display: flex; flex-direction: column;
  }
  .mono { font-family: Consolas, "SF Mono", Menlo, monospace; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .word { font-size: 84px; font-weight: 800; letter-spacing: -2px; }
  .word span { color: #3fb950; }
  .badge {
    font-size: 26px; padding: 12px 22px; border-radius: 12px;
    background: #161b22; border: 1px solid #30363d;
  }
  .badge b { color: #3fb950; font-weight: 400; margin-right: 10px; }
  .tag { font-size: 32px; line-height: 1.3; color: #c9d1d9; margin-top: 22px; max-width: 1080px; }
  .tag em { color: #e6edf3; font-style: normal; font-weight: 600; }
  .stat { margin-top: 44px; display: flex; align-items: baseline; gap: 26px; }
  .stat .from { font-size: 76px; font-weight: 800; color: #f85149; text-decoration: line-through; text-decoration-thickness: 5px; }
  .stat .arrow { font-size: 60px; color: #7d8590; }
  .stat .to { font-size: 76px; font-weight: 800; color: #3fb950; }
  .stat .unit { font-size: 34px; color: #c9d1d9; }
  .stat .pct { font-size: 40px; font-weight: 800; color: #0d1117; background: #3fb950; padding: 4px 16px; border-radius: 10px; }
  .chips { margin-top: auto; display: flex; flex-wrap: wrap; gap: 12px; }
  .chip { font-size: 21px; padding: 8px 16px; border-radius: 999px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; }
</style>
</head>
<body>
  <div class="top">
    <div class="word">slim<span>cp</span></div>
    <div class="badge mono"><b>❯</b>npx slimcp audit</div>
  </div>
  <p class="tag">Your MCP servers eat your AI's context window before you type a word.<br><em>Put them on a token diet.</em></p>
  <div class="stat">
    <span class="from">28,307</span><span class="arrow">→</span><span class="to">801</span><span class="unit">tokens</span><span class="pct">−97%</span>
  </div>
  <div class="chips">
    <span class="chip">Claude Desktop</span><span class="chip">Claude Code</span><span class="chip">Cursor</span><span class="chip">VS Code</span>
    <span class="chip">Windsurf</span><span class="chip">Gemini CLI</span><span class="chip">Codex</span>
  </div>
</body>
</html>
